<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voting System Login</title>
  <style>
    /* ======== General Styles ======== */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      color: #333;
    }

    /* ======== Login Card ======== */
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      width: 350px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    h2 {
      margin-bottom: 20px;
      color: #111827;
    }

    /* ======== Input Fields ======== */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* ======== Button ======== */
    button {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background: #4338ca;
    }

    /* ======== Error Message ======== */
    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
    }

    /* ======== Footer ======== */
    .footer {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
    }

    /* ======== Responsive Media Queries ======== */
    @media (max-width: 768px) {
      .login-card {
        width: 80%;
        padding: 30px 20px;
      }
      h2 {
        font-size: 22px;
      }
      button {
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        width: 90%;
        padding: 25px 15px;
      }
      input {
        font-size: 13px;
        padding: 9px 10px;
      }
      button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>🗳️ Voter Login</h2>
    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="voterId">Voter ID</label>
        <input
          type="text"
          id="voterId"
          name="voterId"
          placeholder="e.g., MITVC0050"
          required
        />
      </div>

      <button type="submit">Login</button>
    </form>

    <p class="footer">Only registered voters can log in</p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const name = document.getElementById("name").value.trim().toLowerCase();
      const voterId = document.getElementById("voterId").value.trim().toUpperCase();

      if (!name || !voterId) {
        showError("Please fill all fields.");
        return;
      }

      // Get voter list from localStorage (added by admin)
      const voters = JSON.parse(localStorage.getItem("voters")) || [];

      // Check if voter exists
      const voter = voters.find(
        (v) => v.name.toLowerCase() === name && v.voterId.toUpperCase() === voterId
      );

      if (!voter) {
        showError("Invalid credentials! You are not a registered voter.");
        return;
      }

      // Save active voter info for session
      localStorage.setItem("activeVoter", JSON.stringify(voter));

      alert(`Welcome ${voter.name}! Redirecting to homepage...`);
      window.location.href = "homepage.html";
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
